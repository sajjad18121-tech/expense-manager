<style>@font-face{font-family:Vazirmatn;src:local("Vazirmatn"),url(Vazirmatn.woff2) format("woff2");font-display:swap}
:root{--bg:#f3f4f7;--card:#fff;--tx:#0b1220;--mu:#6b7487;--bd:#e8eaef;--raise:#f0f2f6;--ac:#2f6bff;--ac2:#7c4dff;--acs:#2f6bff1a;--inc:#10a46a;--exp:#ec4a5f;--cg:linear-gradient(#fff0,#fff0);--csh:0 1px 2px #0b12200a;--sheet:#fff;--navbg:#ffffffe6;--gl:0 8px 22px -6px #2f6bff99;--nav:64px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);--r:20px}
[data-theme=dark]{--bg:#060a14;--card:#0e1628;--tx:#f1f5fc;--mu:#8fa0bd;--bd:#ffffff14;--raise:#ffffff0f;--ac:#5b8cff;--ac2:#8b5cf6;--acs:#5b8cff26;--inc:#34d399;--exp:#ff6b81;--cg:linear-gradient(180deg,#ffffff0d,#ffffff03);--csh:inset 0 1px 0 #ffffff12,0 14px 30px -16px #000;--sheet:linear-gradient(180deg,#18244a,#0e1628 40%);--navbg:#0e1628d9;--gl:0 10px 26px -6px #5b8cffaa;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;-webkit-text-size-adjust:100%;background:var(--bg)}html,body{margin:0}
body{font:14.5px/1.7 Vazirmatn,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-variant-numeric:tabular-nums;background:var(--bg);color:var(--tx);overflow-x:clip;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 38% at 100% -4%,#5b8cff30,transparent 70%),radial-gradient(60% 34% at 0% 26%,#8b5cf620,transparent 70%),radial-gradient(70% 30% at 50% 108%,#5b8cff1c,transparent 70%)}
[data-theme=light] body:before{opacity:.5}
button{font:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:calc(62px + var(--sat));padding:var(--sat) 16px 0;background:linear-gradient(var(--bg) 62%,transparent)}
#top b{flex:1;font-size:23px;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:42px;height:42px;border:1px solid var(--bd);background:var(--raise);color:var(--tx);display:grid;place-items:center;border-radius:14px;cursor:pointer;transition:transform .12s}
.ib:active{transform:scale(.9)}.ib[hidden]{display:none}
#ad{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;box-shadow:var(--gl)}
main{max-width:520px;margin:0 auto;padding:4px 16px calc(var(--nav) + var(--sab) + 46px)}
main>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
main>:nth-child(2){animation-delay:.05s}main>:nth-child(3){animation-delay:.1s}main>:nth-child(4){animation-delay:.15s}main>:nth-child(5){animation-delay:.2s}main>:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}}
h2{display:none}
h3{margin:0 0 12px;font-size:14px;font-weight:800}
h3:before{content:"";display:inline-block;width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--ac),var(--ac2));margin-left:8px;vertical-align:-2px}
#mb h3:before{display:none}
.sub{display:inline-block;color:var(--mu);font-weight:700;font-size:12.5px;margin:-2px 0 12px;padding:2px 12px;border-radius:999px;background:var(--raise);border:1px solid var(--bd)}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.g2,.g1{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:10px}
.c{background:var(--cg),var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--csh)}
.c small{color:var(--mu);display:block;margin-bottom:3px;font-size:12px}
.c b{font-size:15.5px;font-weight:800}
.g>.c{padding:14px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.ac{color:var(--ac)}.mu{color:var(--mu)}
.hero{grid-column:1/-1;position:relative;overflow:hidden;color:#fff;border:1px solid #ffffff2b;border-radius:28px;background:radial-gradient(90% 120% at 100% 0,#5b8cffe0,transparent 58%),radial-gradient(80% 110% at 0 100%,#8b5cf6b0,transparent 62%),linear-gradient(145deg,#15224f,#0a1030);box-shadow:inset 0 1px 0 #ffffff40,0 24px 50px -16px #4a6bffaa}
.g>.hero{padding:22px 20px 18px}
.hero:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;left:-40px;top:-60px;border:1px solid #ffffff22;box-shadow:0 0 0 28px #ffffff0a,0 0 0 56px #ffffff06}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,#ffffff22 50%,transparent 62%);transform:translateX(-130%);animation:sh 7s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes sh{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.hero small{color:#ffffffb8;font-size:13px;margin-bottom:6px;position:relative}
.hero .bal{display:block;position:relative;font-size:clamp(25px,8.6vw,34px);font-weight:800;line-height:1.3;color:#fff;text-shadow:0 2px 24px #0006}
.hero .hs{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1}
.hero .hs>span{flex:1;min-width:0;display:flex;flex-direction:column;background:#ffffff1a;border:1px solid #ffffff26;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:15px;padding:10px 12px;font-size:13px;font-weight:700}

.ar{width:17px;height:17px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-style:normal;color:#06101f;font-weight:900}.ar.up{background:#34d399;box-shadow:0 0 10px #34d399aa}.ar.dn{background:#ff6b81;box-shadow:0 0 10px #ff6b81aa}
button.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:15px;padding:0 18px;min-height:50px;font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--gl),inset 0 1px 0 #ffffff40;transition:transform .12s,filter .12s}
button.b:active{transform:scale(.97);filter:brightness(.9)}

.row.sp:has(>h2){margin-bottom:12px}.row.sp:has(>h2)>button{flex:1}
.row.sp:has(>h2):has(button[onclick="txForm()"]){display:none}
input,select,textarea{width:100%;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--bd);background:var(--raise);color:var(--tx);font:inherit;font-size:16px;margin-top:6px;outline:0;-webkit-appearance:none;appearance:none;transition:border-color .15s,box-shadow .15s,background .15s}

select option{background:#0e1628;color:#f1f5fc}[data-theme=light] select option{background:#fff;color:#0b1220}
input[type=color]{padding:4px}input[type=file]{padding:10px 12px;line-height:1.4}

label,.fl{display:block;margin-bottom:14px;color:var(--mu);font-size:12.5px;font-weight:700}
.fl{margin:16px 0 0}.fl:first-child{margin-top:0}
.it{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0;padding-bottom:0}

.bar{height:9px;background:var(--raise);border-radius:6px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:6px;box-shadow:0 0 14px var(--ac)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px}

.c>p.mu:only-child{text-align:center;padding:20px 0;margin:0}

.seg{display:flex;background:var(--raise);border:1px solid var(--bd);border-radius:15px;padding:4px;margin-bottom:16px}

.amt{text-align:center;padding:18px 0 16px;margin-bottom:12px;border-radius:26px;border:1px solid var(--bd);background:radial-gradient(75% 100% at 50% 0,#5b8cff2e,transparent 72%),var(--cg),var(--card)}

#h_bal{font-size:12px;margin-top:8px;color:var(--mu)}
.chips{flex-wrap:nowrap!important;overflow-x:auto;margin:10px -16px 12px!important;padding:2px 16px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips .b{flex-shrink:0;white-space:nowrap;min-height:40px;padding:0 14px!important;border-radius:999px;font-size:13.5px;box-shadow:inset 0 0 0 1px var(--bd)}
.chips .b[style*="var(--ac)"]{background:linear-gradient(135deg,var(--ac),var(--ac2))!important;box-shadow:0 4px 12px -4px var(--ac)}
.cta{position:sticky;bottom:calc(var(--nav) + var(--sab) + 24px);margin-top:14px;z-index:5}
.cta .b{width:100%;min-height:56px;font-size:16.5px;border-radius:18px}
.flt summary{list-style:none;cursor:pointer;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:30px}
.flt summary::-webkit-details-marker{display:none}
.flt summary:after{content:"";width:8px;height:8px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
.flt[open] summary:after{transform:rotate(-135deg)}
.flt{margin-bottom:10px}
.grp{padding:4px 16px;margin-bottom:12px}
.mr{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);padding:12px 0;color:var(--tx);font-weight:700;cursor:pointer;text-align:right}
.mr:last-child{border:0}.mr>span:nth-child(2){flex:1}.mr>svg{color:var(--mu);width:18px;height:18px}.mr:active{opacity:.6}
.mi{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5b8cff33,#8b5cf633);box-shadow:inset 0 0 0 1px #5b8cff44;color:var(--ac);display:grid;place-items:center}.mi svg{width:21px;height:21px}
.c div[style*="repeat(7"]{gap:3px!important}
.c div[style*="repeat(7"] .nv{border:0!important;border-radius:14px;min-height:50px;font-size:14px;font-weight:600;padding:5px 0!important;line-height:1.35}

.c svg{max-width:100%}
svg text{fill:var(--mu)}
rect[fill="#16a34a"]{fill:var(--inc);filter:drop-shadow(0 0 1.1px var(--inc))}rect[fill="#e5484d"]{fill:var(--exp);filter:drop-shadow(0 0 1.1px var(--exp))}
svg rect{rx:1.6px}
polyline{stroke:var(--exp);stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 1.4px var(--exp))}
.row>svg[viewBox^="-1.05"]{width:118px!important;filter:drop-shadow(0 8px 16px #0008)}
#tb{position:fixed;left:12px;right:12px;bottom:calc(10px + var(--sab));z-index:40;border-radius:26px;border:1px solid #ffffff1c;background:var(--navbg);-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 16px 40px -8px #000c,inset 0 1px 0 #ffffff1a}
[data-theme=light] #tb{border-color:#0b12200f;box-shadow:0 12px 30px -8px #0b122033}
#tb>div{display:flex;max-width:496px;margin:auto}
#tb button{flex:1;height:var(--nav);border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;cursor:pointer;transition:color .2s}

#mb{background:var(--sheet);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;border-radius:30px 30px 0 0;border-top:1px solid #ffffff22;box-shadow:0 -24px 60px #000a;padding:26px 18px calc(18px + var(--sab));animation:up .3s cubic-bezier(.2,.8,.2,1)}

<script>
/* ===== ابزارها ===== */
const VER=1,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const nd=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g,'');
const fa=n=>Math.round(n).toLocaleString('fa-IR');            // اعداد صحیح تومان با جداکننده
const money=n=>(n<0?'−':'')+fa(Math.abs(n))+' تومان';
const parseAmt=s=>{s=nd(s);return /^\d+$/.test(s)?parseInt(s,10):NaN};
/* ===== تقویم شمسی ===== */
function g2j(gy,gm,gd){const m=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let d=355666+365*gy+Math.floor((y2+3)/4)-Math.floor((y2+99)/100)+Math.floor((y2+399)/400)+gd+m[gm-1];let jy=-1595+33*Math.floor(d/12053);d%=12053;jy+=4*Math.floor(d/1461);d%=1461;if(d>365){jy+=Math.floor((d-1)/365);d=(d-1)%365}const jm=d<186?1+Math.floor(d/31):7+Math.floor((d-186)/30),jd=1+(d<186?d%31:(d-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){jy+=1595;let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor((jy%33+3)/4)+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);let gy=400*Math.floor(d/146097);d%=146097;if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}gy+=4*Math.floor(d/1461);d%=1461;if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}let gd=d+1;const s=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;for(;gm<13&&gd>s[gm];gm++)gd-=s[gm];return[gy,gm,gd]}
const p2=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+p2(m)+'-'+p2(d);
const todayISO=()=>{const d=new Date();return iso(d.getFullYear(),d.getMonth()+1,d.getDate())};
const nowT=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
const J=d=>{const[a,b,c]=d.split('-').map(Number);return g2j(a,b,c)};
const jstr=d=>{const[y,m,x]=J(d);return y+'/'+p2(m)+'/'+p2(x)};
const jfa=d=>jstr(d).replace(/\d/g,c=>'۰۱۲۳۴۵۶۷۸۹'[c]);
const ym=d=>{const j=J(d);return j[0]+'/'+p2(j[1])};
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const ymLabel=k=>{const[y,m]=k.split('/').map(Number);return MN[m-1]+' '+fa(y).replace(/٬/g,'')};
const curYM=()=>ym(todayISO());
const addM=(k,n)=>{let[y,m]=k.split('/').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'/'+p2(m)};
function parseJ(s){s=nd(s);const m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!m)return null;const[y,mo,d]=[+m[1],+m[2],+m[3]];if(mo<1||mo>12||d<1||d>(mo<=6?31:mo<=11?30:30))return null;const g=j2g(y,mo,d);return iso(g[0],g[1],g[2])}
function addMonthsISO(d,n){const[y,m,x]=J(d);const k=addM(y+'/'+p2(m),n).split('/').map(Number);const g=j2g(k[0],k[1],Math.min(x,k[1]<=6?31:29));return iso(g[0],g[1],g[2])}
/* ===== ذخیره‌سازی IndexedDB ===== */
let S,idb;
const defCats=()=>[...'خوراک و مواد غذایی|رستوران و کافه|حمل‌ونقل و بنزین|مسکن و اجاره|قبوض و شارژ|خرید شخصی|پوشاک|درمان و دارو|تفریح و سرگرمی|سفر|اقساط و وام|ورزش و سلامتی|حیوانات خانگی|آموزش|اشتراک‌ها|سایر هزینه‌ها'.split('|')].map((n,i)=>({id:'e'+i,t:'exp',n,ic:'🏷️',co:'#e5484d'}))
.concat('حقوق|پاداش|اضافه‌کاری|درآمد جانبی|فروش دارایی|سود سرمایه‌گذاری|دریافت طلب|سایر درآمدها'.split('|').map((n,i)=>({id:'i'+i,t:'inc',n,ic:'💵',co:'#16a34a'})));
const fresh=()=>({v:VER,accounts:[{id:uid(),n:'کیف پول اصلی',k:'cash',open:0,on:true,d:todayISO(),note:''}],cats:defCats(),tx:[],budgets:{},loans:[],debts:[],goals:[],checks:[],assets:[],seen:false});
function openDB(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('fin-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const dbGet=()=>new Promise((res,rej)=>{const r=idb.transaction('kv').objectStore('kv').get('db');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
function save(){return new Promise((res)=>{try{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(JSON.parse(JSON.stringify(S)),'db');t.oncomplete=res;t.onerror=()=>{toast('خطا در ذخیره‌سازی',1);res()}}catch(e){toast('خطا در ذخیره‌سازی',1);res()}})}
/* ===== رابط ===== */
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'#e5484d':'';t.style.color=err?'#fff':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function modal(html){$('#mb').innerHTML=html;$('#mod').style.display='flex'}
function closeM(){$('#mod').style.display='none'}
$('#mod').addEventListener('mousedown',e=>{if(e.target.id=='mod')closeM()});
const askC=(m,fn)=>modal(`<h3>تأیید</h3><p>${esc(m)}</p><div class="row"><button class="b d" id="yes">بله، انجام شود</button><button class="b s" onclick="closeM()">انصراف</button></div>`)||($('#yes').onclick=()=>{closeM();fn()});
const TABS=[['home','ثبت هزینه','➕'],['dash','داشبورد','📊'],['tx','تراکنش‌ها','🧾'],['acc','حساب‌ها','🏦'],['loan','اقساط','💳'],['debt','بدهی‌ها و طلب‌ها','🤝'],['bud','بودجه‌بندی','🎯'],['goal','پس‌انداز','🐖'],['rep','گزارش‌ها','📈'],['cal','تقویم','📅'],['set','تنظیمات','⚙️'],['chk','مدیریت چک‌ها','🧾'],['ast','دارایی‌ها و سرمایه‌گذاری‌ها','💎'],['more','بیشتر','⋯']];
let tab='home',F={q:'',type:'',cat:'',acc:'',from:'',to:'',sort:'new'};

const MAIN=['home','dash','tx','cal','more'];let RS=1,DIP=null;
function go(t){if(t!=tab)history.pushState({t},'');tab=t;RS=1;render()}
history.replaceState({t:'home'},'');
addEventListener('popstate',e=>{tab=(e.state&&e.state.t)||'home';RS=1;render()});
function chrome(){const t=TABS.find(x=>x[0]==tab);$('#tt').textContent=t[1];$('#bk').hidden=MAIN.includes(tab);$('#ad').hidden=!['dash','tx','cal'].includes(tab);const cur=MAIN.includes(tab)?tab:'more';document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.k==cur));$('#tb [data-k=dash]').classList.toggle('al',remN()>0)}
function applyTheme(){let t=localStorage.getItem('theme')||'dark';if(t=='auto')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;$('#tc').content=t=='dark'?'#060a14':'#060a14'}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme);
function segHTML(){return'<div class="seg" id="f_seg">'+[['exp','هزینه'],['inc','درآمد'],['trf','انتقال']].map(([k,n])=>`<button type="button" data-k="${k}" onclick="segT('${k}')">${n}</button>`).join('')+'</div>'}
function segUp(){document.querySelectorAll('#f_seg button').forEach(b=>b.classList.toggle('on',b.dataset.k==$('#f_type').value))}
function segT(k){$('#f_type').value=k;catOpts()}
function moreView(){const G=[[['acc','حساب‌ها','<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>'],['bud','بودجه‌بندی','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>'],['loan','وام‌ها و اقساط','<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 11h18M7 16h3"/>'],['debt','طلب‌ها و بدهی‌ها','<path d="M7 7h11l-3-3M17 17H6l3 3"/>'],['goal','اهداف پس‌انداز','<path d="M5 21V4M5 5h12l-2 4 2 4H5"/>'],['chk','مدیریت چک‌ها','<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h6M7 14h3M15 14l1.5 1.5L19 12"/>'],['ast','دارایی‌ها و سرمایه‌گذاری‌ها','<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/>']],[['rep','گزارش‌ها','<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>'],['set','تنظیمات و پشتیبان‌گیری','<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>']]];
return G.map(g=>`<div class="c grp">${g.map(([k,n,p])=>`<button class="mr" onclick="go('${k}')"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg></span><span>${n}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>`).join('')}</div>`).join('')+`<p class="mu" style="text-align:center;font-size:12px;margin-top:16px">اطلاعات فقط روی همین دستگاه ذخیره می‌شود؛ مرتب پشتیبان بگیرید.</p>`}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DIP=e;if(tab=='set')render()});
const standalone=()=>matchMedia('(display-mode:standalone)').matches||navigator.standalone;
function installCard(){if(standalone())return'';const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);return`<div class="c"><h3>نصب برنامه</h3><p class="mu">${DIP?'برنامه را روی صفحه اصلی نصب کنید تا مثل یک اپ و بدون اینترنت کار کند.':ios?'در سافاری دکمه اشتراک‌گذاری را بزنید و «Add to Home Screen» را انتخاب کنید.':'از منوی مرورگر «Install app» یا «افزودن به صفحه اصلی» را بزنید.'}</p>${DIP?'<button class="b" style="width:100%" onclick="doInstall()">نصب برنامه</button>':''}</div>`}
async function doInstall(){if(!DIP)return;DIP.prompt();await DIP.userChoice;DIP=null;render()}
function render(){chrome();
$('#v').innerHTML=({home:homeView,dash,tx:txView,acc:accView,bud:budView,loan:loanView,debt:debtView,goal:goalView,rep:repView,cal:calView,set:setView,more:moreView,chk:chkView,ast:astView})[tab]();if(RS){scrollTo(0,0);RS=0}if(tab=='home'&&$('#h_a'))$('#h_a').focus()}
/* ===== محاسبات ===== */
const cat=id=>S.cats.find(c=>c.id==id)||{n:'(حذف‌شده)',ic:'❓',co:'#888'};
const acn=id=>(S.accounts.find(a=>a.id==id)||{n:'(نامشخص)'}).n;
function bal(a){let b=a.open;for(const t of S.tx){if(t.type=='inc'&&t.acc==a.id)b+=t.amt;else if(t.type=='exp'&&t.acc==a.id)b-=t.amt;else if(t.type=='trf'){if(t.acc==a.id)b-=t.amt;if(t.to==a.id)b+=t.amt}}return b}
const sumT=(type,f)=>S.tx.filter(t=>t.type==type&&(!f||f(t))).reduce((s,t)=>s+t.amt,0);
const inM=k=>t=>ym(t.d)==k;
const byCat=(list)=>{const m={};list.forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const loanInfo=l=>{const rem=Math.max(l.count-l.paid,0);return{rem,left:rem*l.inst,pct:l.count?Math.min(100,Math.round(l.paid/l.count*100)):0,next:rem?addMonthsISO(l.first,l.paid):null}};
const spentIn=(k,c)=>sumT('exp',t=>ym(t.d)==k&&t.cat==c);
/* ===== نمودارها (SVG ساده) ===== */
function bars(keys,a,b){const mx=Math.max(1,...a,...b),W=100/keys.length;let s=`<svg viewBox="0 0 100 52" style="width:100%"><g>`;keys.forEach((k,i)=>{const x=i*W,h1=a[i]/mx*36,h2=b[i]/mx*36;s+=`<rect x="${x+W*.12}" y="${40-h1}" width="${W*.3}" height="${h1}" fill="#16a34a" rx="1"/><rect x="${x+W*.46}" y="${40-h2}" width="${W*.3}" height="${h2}" fill="#e5484d" rx="1"/><text x="${x+W/2}" y="47" font-size="3.2" text-anchor="middle" fill="currentColor">${MN[+k.split('/')[1]-1]}</text>`});return s+'</g></svg><div class="mu" style="font-size:12px"><span class="dot" style="background:#16a34a"></span>درآمد <span class="dot" style="background:#e5484d"></span>هزینه</div>'}
function pie(list){const tot=list.reduce((s,[,v])=>s+v,0);if(!tot)return'<p class="mu">داده‌ای نیست</p>';let a=0,p='';list.slice(0,8).forEach(([id,v])=>{const f=v/tot,x1=Math.cos(a*6.2832),y1=Math.sin(a*6.2832);a+=f;const x2=Math.cos(a*6.2832),y2=Math.sin(a*6.2832);p+=f>.999?`<circle r="1" fill="${cat(id).co}"/>`:`<path d="M0 0L${x1} ${y1}A1 1 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${cat(id).co}"/>`});
return`<div class="row"><svg viewBox="-1.05 -1.05 2.1 2.1" style="width:130px;flex-shrink:0">${p}<circle r=".62" fill="var(--card)"/></svg><div style="flex:1;min-width:140px">${list.slice(0,8).map(([id,v])=>`<div class="row sp" style="font-size:12px"><span><span class="dot" style="background:${cat(id).co}"></span>${esc(cat(id).n)}</span><span>${Math.round(v/tot*100)}٪</span></div>`).join('')}</div></div>`}
const bar=(p,co)=>`<div class="bar"><i style="width:${Math.min(100,p)}%;${co?'background:'+co:''}"></i></div>`;
/* ===== داشبورد ===== */
function dash(){const k=curYM(),pk=addM(k,-1),inc=sumT('inc',inM(k)),exp=sumT('exp',inM(k)),pinc=sumT('inc',inM(pk)),pexp=sumT('exp',inM(pk));
const cash=S.accounts.filter(a=>a.on).reduce((s,a)=>s+bal(a),0),debt=S.loans.reduce((s,l)=>s+loanInfo(l).left,0)+S.debts.filter(d=>d.kind=='debt').reduce((s,d)=>s+d.amt-d.paid,0),cred=S.debts.filter(d=>d.kind=='cred').reduce((s,d)=>s+d.amt-d.paid,0);
const bd=S.budgets[k]||{},bt=Object.values(bd).reduce((s,v)=>s+v,0),bs=Object.keys(bd).reduce((s,c)=>s+spentIn(k,c),0),bp=bt?Math.round(bs/bt*100):0;
const keys=[...Array(6)].map((_,i)=>addM(k,i-5)),ai=keys.map(x=>sumT('inc',inM(x))),ae=keys.map(x=>sumT('exp',inM(x)));
const al=Object.keys(bd).map(c=>({c,p:bd[c]?spentIn(k,c)/bd[c]*100:0})).filter(x=>x.p>=70).sort((a,b)=>b.p-a.p).map(x=>`<div class="al">${x.p>=100?'⛔ عبور از سقف بودجه':x.p>=80?'⚠️ مصرف ۸۰٪ بودجه':'⚠️ مصرف ۷۰٪ بودجه'}: ${esc(cat(x.c).n)} (${fa(Math.round(x.p))}٪)</div>`).join('');
const due=S.loans.map(l=>({l,i:loanInfo(l)})).filter(x=>x.i.next).sort((a,b)=>a.i.next<b.i.next?-1:1).slice(0,4);
const sv=inc-exp;
return`<div class="sub">${ymLabel(k)}</div>${remBanner()}<div class="g">
<div class="c hero"><small>دارایی نقدی</small><b class="bal">${money(cash)}</b><div class="hs"><span><em><i class="ar up">↑</i>درآمد ماه</em>${money(inc)}</span><span><em><i class="ar dn">↓</i>هزینه ماه</em>${money(exp)}</span></div></div>
<div class="c"><small>مانده پس از هزینه</small><b class="${sv<0?'exp':'inc'}">${money(sv)}</b></div>
<div class="c"><small>مجموع بدهی‌ها</small><b class="exp">${money(debt)}</b></div>
<div class="c"><small>مجموع طلب‌ها</small><b class="inc">${money(cred)}</b></div>
<div class="c"><small>پس‌انداز ماهانه</small><b>${inc?fa(Math.round(Math.max(sv,0)/inc*100)):'۰'}٪ <span class="mu" style="font-size:12px">از درآمد</span></b></div>
<div class="c" style="grid-column:1/-1"><small>مصرف بودجه</small><b>${bt?fa(bp)+'٪':'بودجه‌ای تعریف نشده'}</b>${bt?bar(bp,bp>=100?'var(--exp)':''):''}</div></div>
${S.tx.length?'':`<div class="c" style="margin-bottom:14px"><b>👋 شروع سریع</b><p class="mu">۱) از حساب‌ها، موجودی اولیه حساب «کیف پول اصلی» را تنظیم کنید. ۲) با فرم صفحه اول اولین درآمد یا هزینه را ثبت کنید. ۳) در بخش بودجه سقف هزینه هر دسته را بدهید. ۴) در تنظیمات از اطلاعات پشتیبان بگیرید.</p></div>`}
<div class="g2"><div class="c"><h3>درآمد و هزینه ۶ ماه اخیر</h3>${bars(keys,ai,ae)}</div><div class="c"><h3>هزینه‌ها بر اساس دسته (ماه جاری)</h3>${pie(byCat(S.tx.filter(t=>t.type=='exp'&&ym(t.d)==k)))}</div>
<div class="c"><h3>مقایسه با ماه قبل</h3>${[['درآمد',inc,pinc,'inc'],['هزینه',exp,pexp,'exp']].map(([n,a,b,c])=>`<div class="it"><span>${n}</span><span class="${c}">${money(a)} <span class="mu">/ قبل: ${money(b)}</span></span></div>`).join('')}</div>
<div class="c"><h3>روند هزینه</h3>${trend(keys,ae)}</div></div>
<div class="g2"><div class="c"><h3>هشدار بودجه</h3>${al||'<p class="mu">هشداری وجود ندارد ✓</p>'}</div>
<div class="c"><h3>اقساط نزدیک</h3>${due.map(x=>`<div class="it"><span>${esc(x.l.n)}</span><span>${jfa(x.i.next)} — ${money(x.l.inst)}</span></div>`).join('')||'<p class="mu">قسطی ثبت نشده</p>'}</div>
<div class="c" style="grid-column:1/-1"><h3>آخرین تراکنش‌ها</h3>${txList(sorted(S.tx).slice(0,6),true)||'<p class="mu">هنوز تراکنشی ثبت نشده</p>'}</div></div>`}
function trend(keys,a){const mx=Math.max(1,...a);const pts=a.map((v,i)=>`${i*(100/(a.length-1))},${40-v/mx*36}`).join(' ');return`<svg viewBox="0 0 100 48" style="width:100%"><polygon points="0,40 ${pts} 100,40" fill="var(--exp)" fill-opacity=".13"/><polyline points="${pts}" fill="none" stroke="#e5484d" stroke-width="1.2"/>${keys.map((k,i)=>`<text x="${i*(100/(keys.length-1))}" y="47" font-size="3.2" text-anchor="${i?i==keys.length-1?'end':'middle':'start'}" fill="currentColor">${MN[+k.split('/')[1]-1]}</text>`).join('')}</svg>`}
/* ===== تراکنش‌ها ===== */
const sorted=l=>[...l].sort((a,b)=>(b.d+b.t+b.id).localeCompare(a.d+a.t+a.id));
function txList(l,ro){return l.map(t=>{const c=t.type=='trf'?{n:'انتقال',ic:'🔁'}:cat(t.cat),col=t.type=='inc'?'inc':t.type=='exp'?'exp':'ac',sg=t.type=='inc'?'+':t.type=='exp'?'−':'';
return`<div class="it"><i class="ti" style="background:${c.co||'#2f6bff'}22">${c.ic}</i><div style="flex:1;min-width:0"><b>${esc(c.n)}</b><div class="mu" style="font-size:12px">${jfa(t.d)} ${esc(t.t)} · ${t.type=='trf'?esc(acn(t.acc))+' ← '+esc(acn(t.to)):esc(acn(t.acc))}${t.note?' · '+esc(t.note):''}</div></div><b class="${col}" style="white-space:nowrap">${sg}${fa(t.amt)}</b>${ro?'':`<div class="act"><button class="b s x" onclick="txForm('${t.id}')">ویرایش</button> <button class="b d x" onclick="delTx('${t.id}')">حذف</button></div>`}</div>`}).join('')}
function txView(){let l=S.tx.filter(t=>(!F.type||t.type==F.type)&&(!F.cat||t.cat==F.cat)&&(!F.acc||t.acc==F.acc||t.to==F.acc)&&(!F.from||t.d>=F.from)&&(!F.to||t.d<=F.to)&&(!F.q||(t.note||'').includes(F.q)||cat(t.cat).n.includes(F.q)));
l=sorted(l);if(F.sort=='old')l.reverse();const i=l.filter(t=>t.type=='inc').reduce((s,t)=>s+t.amt,0),e=l.filter(t=>t.type=='exp').reduce((s,t)=>s+t.amt,0);
const o=(a,v)=>a.map(([k,n])=>`<option value="${k}" ${v==k?'selected':''}>${esc(n)}</option>`).join('');
return`<div class="row sp"><h2>تراکنش‌ها</h2><button class="b" onclick="txForm()">+ تراکنش جدید</button></div>
<details class="c np flt" ${F.q||F.type||F.cat||F.acc||F.from||F.to?'open':''}><summary>فیلتر و جست‌وجو</summary><div class="g" style="margin:14px 0 10px">
<label>جست‌وجو<input value="${esc(F.q)}" onchange="F.q=this.value;render()"></label>
<label>نوع<select onchange="F.type=this.value;render()">${o([['','همه'],['inc','درآمد'],['exp','هزینه'],['trf','انتقال']],F.type)}</select></label>
<label>دسته<select onchange="F.cat=this.value;render()">${o([['','همه'],...S.cats.map(c=>[c.id,c.n])],F.cat)}</select></label>
<label>حساب<select onchange="F.acc=this.value;render()">${o([['','همه'],...S.accounts.map(c=>[c.id,c.n])],F.acc)}</select></label>
<label>از تاریخ (۱۴۰۵/۰۱/۰۱)<input value="${F.from?jstr(F.from):''}" onchange="F.from=parseJ(this.value)||'';render()"></label>
<label>تا تاریخ<input value="${F.to?jstr(F.to):''}" onchange="F.to=parseJ(this.value)||'';render()"></label>
<label>مرتب‌سازی<select onchange="F.sort=this.value;render()">${o([['new','جدیدترین'],['old','قدیمی‌ترین']],F.sort)}</select></label></div>
<button class="b s x" onclick="F={q:'',type:'',cat:'',acc:'',from:'',to:'',sort:'new'};render()">پاک‌کردن فیلترها</button></details>
<div class="c"><div class="row sp" style="margin-bottom:6px"><span>${fa(l.length)} تراکنش</span><span><span class="inc">درآمد ${money(i)}</span> · <span class="exp">هزینه ${money(e)}</span></span></div>${txList(l)||'<p class="mu">تراکنشی یافت نشد</p>'}</div>`}
function txForm(id){const t=id?S.tx.find(x=>x.id==id):{type:'exp',amt:'',cat:'',acc:S.accounts.find(a=>a.on)?.id,to:'',d:todayISO(),t:nowT(),note:''};
if(!S.accounts.some(a=>a.on))return toast('ابتدا یک حساب فعال بسازید',1);
const ac=S.accounts.filter(a=>a.on||a.id==t.acc||a.id==t.to);
modal(`<h3>${id?'ویرایش':'ثبت'} تراکنش</h3>${segHTML()}<select id="f_type" onchange="catOpts()" hidden><option value="exp">هزینه</option><option value="inc">درآمد</option><option value="trf">انتقال بین حساب‌ها</option></select>
<label>مبلغ (تومان)<input id="f_amt" inputmode="numeric" value="${t.amt?fa(t.amt):''}"></label>
<label id="f_cl">دسته‌بندی<select id="f_cat"></select></label>
<label><span id="f_al">حساب</span><select id="f_acc">${ac.map(a=>`<option value="${a.id}">${esc(a.n)}</option>`).join('')}</select></label>
<label id="f_tl" style="display:none">حساب مقصد<select id="f_to">${ac.map(a=>`<option value="${a.id}">${esc(a.n)}</option>`).join('')}</select></label>
<div class="row"><label style="flex:1">تاریخ شمسی<input id="f_d" value="${jstr(t.d)}"></label><label style="flex:1">ساعت<input id="f_t" type="time" value="${t.t}"></label></div>
<label>توضیحات<input id="f_n" maxlength="200" value="${esc(t.note)}"></label>
<div class="row"><button class="b" onclick="saveTx('${id||''}')">ذخیره</button><button class="b s" onclick="closeM()">انصراف</button></div>`);
$('#f_type').value=t.type;$('#f_acc').value=t.acc;if(t.to)$('#f_to').value=t.to;catOpts(t.cat)}
function catOpts(sel){segUp();const ty=$('#f_type').value,trf=ty=='trf';$('#f_cl').style.display=trf?'none':'';$('#f_tl').style.display=trf?'':'none';$('#f_al').textContent=trf?'حساب مبدأ':'حساب';
const l=S.cats.filter(c=>c.t==ty&&(!c.hide||c.id==sel));$('#f_cat').innerHTML=l.map(c=>`<option value="${c.id}">${c.ic} ${esc(c.n)}</option>`).join('');if(sel)$('#f_cat').value=sel}
async function saveTx(id){const ty=$('#f_type').value,amt=parseAmt($('#f_amt').value),d=parseJ($('#f_d').value),t=$('#f_t').value||nowT(),acc=$('#f_acc').value,to=$('#f_to').value;
if(!(amt>0)||!Number.isSafeInteger(amt))return toast('مبلغ معتبر (عدد صحیح مثبت) وارد کنید',1);if(!d)return toast('تاریخ نامعتبر است (نمونه: ۱۴۰۵/۰۸/۲۱)',1);
if(ty=='trf'&&acc==to)return toast('حساب مبدأ و مقصد باید متفاوت باشند',1);if(ty!='trf'&&!$('#f_cat').value)return toast('دسته‌بندی انتخاب کنید',1);
const o={type:ty,amt,cat:ty=='trf'?'':$('#f_cat').value,acc,to:ty=='trf'?to:'',d,t,note:$('#f_n').value.trim()};
if(id)Object.assign(S.tx.find(x=>x.id==id),o);else S.tx.push({id:uid(),...o});await save();closeM();toast('تراکنش ذخیره شد ✓');render()}
function delTx(id){askC('این تراکنش حذف شود؟ موجودی حساب به‌طور خودکار اصلاح می‌شود.',async()=>{const t=S.tx.find(x=>x.id==id);if(t&&t.ref){const l=S.loans.find(x=>x.id==t.ref);if(l&&l.paid>0)l.paid--}S.tx=S.tx.filter(x=>x.id!=id);await save();toast('حذف شد');render()})}
/* ===== حساب‌ها ===== */
const KN={bank:'بانک',cash:'کیف پول نقدی',dig:'کیف پول دیجیتال',other:'سایر'};
function accView(){return`<div class="row sp"><h2>حساب‌ها</h2><button class="b" onclick="accForm()">+ حساب جدید</button></div><div class="g1">${S.accounts.map(a=>`<div class="c" style="${a.on?'':'opacity:.55'}"><small>${KN[a.k]} · ${jfa(a.d)}${a.on?'':' · غیرفعال'}</small><b>${esc(a.n)}</b><div class="${bal(a)<0?'exp':'inc'}" style="margin:6px 0">${money(bal(a))}</div><div class="mu" style="font-size:12px">اولیه: ${money(a.open)}${a.note?'<br>'+esc(a.note):''}</div><div class="row" style="margin-top:8px"><button class="b s x" onclick="accForm('${a.id}')">ویرایش</button><button class="b s x" onclick="toggleAcc('${a.id}')">${a.on?'غیرفعال‌سازی':'فعال‌سازی'}</button></div></div>`).join('')}</div>`}
function accForm(id){const a=id?S.accounts.find(x=>x.id==id):{n:'',k:'bank',open:0,note:''};modal(`<h3>${id?'ویرایش':'ایجاد'} حساب</h3><label>نام<input id="a_n" maxlength="40" value="${esc(a.n)}"></label><label>نوع<select id="a_k">${Object.entries(KN).map(([k,n])=>`<option value="${k}" ${a.k==k?'selected':''}>${n}</option>`).join('')}</select></label><label>موجودی اولیه (تومان؛ برای بدهکاری منفی بنویسید)<input id="a_o" value="${fa(a.open)}"></label><label>توضیحات<input id="a_d" value="${esc(a.note)}"></label><div class="row"><button class="b" onclick="saveAcc('${id||''}')">ذخیره</button><button class="b s" onclick="closeM()">انصراف</button></div>`)}
async function saveAcc(id){const n=$('#a_n').value.trim(),s=nd($('#a_o').value).replace('−','-'),o=/^-?\d+$/.test(s)?parseInt(s,10):NaN;if(!n)return toast('نام حساب را وارد کنید',1);if(isNaN(o))return toast('موجودی اولیه نامعتبر است',1);
if(id){Object.assign(S.accounts.find(x=>x.id==id),{n,k:$('#a_k').value,open:o,note:$('#a_d').value.trim()})}else S.accounts.push({id:uid(),n,k:$('#a_k').value,open:o,on:true,d:todayISO(),note:$('#a_d').value.trim()});await save();closeM();toast('حساب ذخیره شد ✓');render()}
async function toggleAcc(id){const a=S.accounts.find(x=>x.id==id);if(a.on&&S.accounts.filter(x=>x.on).length<2)return toast('حداقل یک حساب باید فعال بماند',1);a.on=!a.on;await save();render()}
/* ===== بودجه ===== */
let BM=curYM();
function budView(){const bd=S.budgets[BM]||{},ex=S.cats.filter(c=>c.t=='exp'&&!c.hide);
return`<h2>بودجه‌بندی</h2><div class="row" style="margin-bottom:12px"><button class="b s" onclick="BM=addM(BM,-1);render()">‹ قبل</button><b>${ymLabel(BM)}</b><button class="b s" onclick="BM=addM(BM,1);render()">بعد ›</button><button class="b s x" onclick="copyBud()">کپی از ماه قبل</button></div>
<div class="c">${ex.map(c=>{const b=bd[c.id]||0,s=spentIn(BM,c.id),p=b?Math.round(s/b*100):0;return`<div class="it" style="display:block"><div class="row sp"><span>${c.ic} ${esc(c.n)}</span><input style="width:150px;margin:0" placeholder="بودجه" value="${b?fa(b):''}" onchange="setBud('${c.id}',this.value)"></div>${b?`<div class="row sp mu" style="font-size:12px;margin-top:4px"><span>خرج‌شده ${money(s)}</span><span>${b-s<0?'بیش از سقف '+money(s-b):'باقی‌مانده '+money(b-s)} · ${fa(p)}٪</span></div>${bar(p,p>=100?'var(--exp)':p>=80?'#f59e0b':'')}${p>=70?`<div class="al" style="margin-top:6px">${p>=100?'⛔ از سقف بودجه عبور کرده‌اید':p>=80?'⚠️ ۸۰٪ بودجه مصرف شده':'⚠️ ۷۰٪ بودجه مصرف شده'}</div>`:''}`:s?`<div class="mu" style="font-size:12px">خرج‌شده ${money(s)}</div>`:''}</div>`}).join('')}</div>`}
async function setBud(c,v){const a=v.trim()?parseAmt(v):0;if(isNaN(a))return toast('مبلغ نامعتبر',1);S.budgets[BM]=S.budgets[BM]||{};if(a)S.budgets[BM][c]=a;else delete S.budgets[BM][c];await save();render()}
async function copyBud(){const p=S.budgets[addM(BM,-1)];if(!p)return toast('ماه قبل بودجه‌ای ندارد',1);S.budgets[BM]={...p};await save();render()}
/* ===== وام، طلب و بدهی ===== */
function loanView(){return`<div class="row sp"><h2>وام‌ها و اقساط</h2><button class="b" onclick="loanForm()">+ وام جدید</button></div>${S.loans.map(l=>{const i=loanInfo(l);return`<div class="c" style="margin-bottom:10px"><div class="row sp"><b>${esc(l.n)}</b><span class="mu">${esc(acn(l.acc))}</span></div><div class="g" style="margin:8px 0"><div><small class="mu">کل بدهی</small>${money(l.total)}</div><div><small class="mu">پرداخت‌شده</small>${money(l.paid*l.inst)}</div><div><small class="mu">باقی‌مانده</small><b class="exp">${money(i.left)}</b></div><div><small class="mu">اقساط باقی‌مانده</small>${fa(i.rem)} از ${fa(l.count)}</div><div><small class="mu">قسط بعدی</small>${i.next?jfa(i.next)+' '+dueTag(i.next):'تسویه ✓'}</div></div>${bar(i.pct)}<div class="mu" style="font-size:12px">${fa(i.pct)}٪ بازپرداخت</div><div class="row" style="margin-top:8px">${i.rem?`<button class="b x" onclick="payLoan('${l.id}')">پرداخت قسط (${fa(l.inst)})</button>`:''}<button class="b s x" onclick="loanForm('${l.id}')">ویرایش</button><button class="b d x" onclick="delLoan('${l.id}')">حذف</button></div></div>`}).join('')||'<p class="mu">وامی ثبت نشده</p>'}`}
function debtView(){return`<div class="row sp"><h2>طلب‌ها و بدهی‌های شخصی</h2><button class="b" onclick="debtForm()">+ ثبت</button></div><div class="c">${S.debts.map(d=>{const r=d.amt-d.paid;return`<div class="it"><div><b>${d.kind=='cred'?'🟢 طلب از':'🔴 بدهی به'} ${esc(d.p)}</b><div class="mu" style="font-size:12px">${jfa(d.d)}${d.due?' · سررسید '+jfa(d.due):''} · کل ${money(d.amt)} · ${r<=0?'تسویه‌شده ✓':'مانده '+money(r)}</div></div><div class="row">${r>0?`<button class="b x" onclick="payDebt('${d.id}')">پرداخت/دریافت</button>`:''}<button class="b d x" onclick="delDebt('${d.id}')">حذف</button></div></div>`}).join('')||'<p class="mu">موردی ثبت نشده</p>'}</div>`}
function loanForm(id){const l=id?S.loans.find(x=>x.id==id):{n:'',total:'',count:'',inst:'',paid:0,first:todayISO(),acc:S.accounts[0].id,note:''};
modal(`<h3>${id?'ویرایش':'ثبت'} وام</h3><label>نام<input id="l_n" value="${esc(l.n)}"></label><label>مبلغ کل بازپرداخت<input id="l_t" value="${l.total?fa(l.total):''}"></label><label>تعداد کل اقساط<input id="l_c" value="${l.count?fa(l.count):''}"></label><label>مبلغ هر قسط<input id="l_i" value="${l.inst?fa(l.inst):''}"></label><label>اقساط پرداخت‌شده<input id="l_p" value="${fa(l.paid)}"></label><label>تاریخ اولین سررسید (روز سررسید ماهانه از آن گرفته می‌شود)<input id="l_f" value="${jstr(l.first)}"></label><label>حساب پرداخت‌کننده<select id="l_a">${S.accounts.map(a=>`<option value="${a.id}" ${a.id==l.acc?'selected':''}>${esc(a.n)}</option>`).join('')}</select></label><label>توضیحات<input id="l_d" value="${esc(l.note)}"></label><div class="row"><button class="b" onclick="saveLoan('${id||''}')">ذخیره</button><button class="b s" onclick="closeM()">انصراف</button></div>`)}
async function saveLoan(id){const o={n:$('#l_n').value.trim(),total:parseAmt($('#l_t').value),count:parseAmt($('#l_c').value),inst:parseAmt($('#l_i').value),paid:parseAmt($('#l_p').value),first:parseJ($('#l_f').value),acc:$('#l_a').value,note:$('#l_d').value.trim()};
if(!o.n||!(o.total>0)||!(o.count>0)||!(o.inst>0)||isNaN(o.paid)||o.paid>o.count||!o.first)return toast('همه فیلدها را درست پر کنید (اقساط پرداخت‌شده نباید بیشتر از کل باشد)',1);
if(id)Object.assign(S.loans.find(x=>x.id==id),o);else S.loans.push({id:uid(),...o});await save();closeM();toast('ذخیره شد ✓');render()}
function payLoan(id){const l=S.loans.find(x=>x.id==id),i=loanInfo(l);askC(`قسط ${fa(l.inst)} تومان از «${acn(l.acc)}» پرداخت و به‌عنوان هزینه ثبت شود؟`,async()=>{if(l.paid>=l.count)return;const c=S.cats.find(c=>c.id=='e10');S.tx.push({id:uid(),type:'exp',amt:l.inst,cat:c?c.id:S.cats.find(c=>c.t=='exp').id,acc:l.acc,to:'',d:todayISO(),t:nowT(),note:'قسط '+l.n+' ('+fa(l.paid+1)+' از '+fa(l.count)+')',ref:l.id});l.paid++;await save();toast('قسط ثبت شد ✓');render()})}
function delLoan(id){askC('وام حذف شود؟ تراکنش‌های پرداخت قبلی حفظ می‌شوند.',async()=>{S.loans=S.loans.filter(x=>x.id!=id);S.tx.forEach(t=>{if(t.ref==id)delete t.ref});await save();render()})}
function debtForm(){modal(`<h3>ثبت طلب/بدهی</h3><label>نوع<select id="d_k"><option value="cred">طلب (از او می‌گیرم)</option><option value="debt">بدهی (به او می‌دهم)</option></select></label><label>نام شخص<input id="d_p"></label><label>مبلغ<input id="d_a"></label><label>تاریخ<input id="d_d" value="${jstr(todayISO())}"></label><label>سررسید (اختیاری)<input id="d_u"></label><div class="row"><button class="b" onclick="saveDebt()">ذخیره</button><button class="b s" onclick="closeM()">انصراف</button></div>`)}
async function saveDebt(){const p=$('#d_p').value.trim(),a=parseAmt($('#d_a').value),d=parseJ($('#d_d').value),u=$('#d_u').value.trim()?parseJ($('#d_u').value):'';if(!p||!(a>0)||!d||u===null)return toast('اطلاعات نامعتبر است',1);S.debts.push({id:uid(),kind:$('#d_k').value,p,amt:a,paid:0,d,due:u});await save();closeM();toast('ثبت شد ✓');render()}
function payDebt(id){const d=S.debts.find(x=>x.id==id),r=d.amt-d.paid;modal(`<h3>پرداخت/دریافت — ${esc(d.p)}</h3><p class="mu">مانده: ${money(r)}</p><label>مبلغ<input id="pd" value="${fa(r)}"></label><div class="row"><button class="b" id="pdo">ثبت</button><button class="b s" onclick="closeM()">انصراف</button></div>`);$('#pdo').onclick=async()=>{const a=parseAmt($('#pd').value);if(!(a>0)||a>r)return toast('مبلغ باید بین ۱ و مانده باشد',1);d.paid+=a;await save();closeM();toast('ثبت شد ✓');render()}}

function expCSV(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',r=[['تاریخ','ساعت','نوع','مبلغ','دسته','حساب','حساب مقصد','توضیحات']];sorted(S.tx).forEach(t=>r.push([jstr(t.d),t.t,{inc:'درآمد',exp:'هزینه',trf:'انتقال'}[t.type],t.amt,t.type=='trf'?'':cat(t.cat).n,acn(t.acc),t.to?acn(t.to):'',t.note]));dl(`transactions-${stamp()}.csv`,'\ufeff'+r.map(x=>x.map(q).join(',')).join('\r\n'),'text/csv');toast('CSV ساخته شد ✓')}
function validate(o){if(!o||o.app!='fin-fa'||!o.data)throw new Error('فایل پشتیبان معتبر نیست');const d=o.data;if(typeof o.version!='number'||o.version>VER)throw new Error('نسخه فایل پشتیبان پشتیبانی نمی‌شود');
for(const k of['accounts','cats','tx','loans','debts','goals'])if(!Array.isArray(d[k]))throw new Error('ساختار فایل خراب است: '+k);
d.tx.forEach(t=>{if(!t.id||!Number.isSafeInteger(t.amt)||!/^\d{4}-\d{2}-\d{2}$/.test(t.d)||!['inc','exp','trf'].includes(t.type))throw new Error('یک تراکنش نامعتبر در فایل وجود دارد')});d.accounts.forEach(a=>{if(!a.id||!Number.isSafeInteger(a.open))throw new Error('حساب نامعتبر در فایل')});(d.checks||[]).forEach(c=>{if(!c.id||!Number.isSafeInteger(c.amt)||!/^\d{4}-\d{2}-\d{2}$/.test(c.due))throw new Error('چک نامعتبر در فایل')});(d.assets||[]).forEach(a=>{if(!a.id||!(a.qty>=0)||!(a.cur>=0)||!(a.buy>=0))throw new Error('دارایی نامعتبر در فایل')});return d}

function calMap(k){const M={},g=d=>M[d]||(M[d]={tx:[],loans:[],debts:[],checks:[],inc:0,exp:0});

S.debts.forEach(d=>{if(d.due&&d.amt>d.paid&&ym(d.due)==k)g(d.due).debts.push(d)});
S.checks.forEach(c=>{if(c.st!='cancelled'&&ym(c.due)==k)g(c.due).checks.push(c)});return M}

function agenda(){const o=[],add=(k,t,n,a,due)=>o.push({k,t,n,a,due,b:`${n} — ${fa(a)} تومان — سررسید ${jfa(due)}`});
S.loans.forEach(l=>{for(let j=l.paid;j<Math.min(l.count,l.paid+3);j++)add('loan:'+l.id+':'+j,'یادآوری قسط',l.n,l.inst,addMonthsISO(l.first,j))});
(S.checks||[]).forEach(c=>{if(c.st=='pending')add('chk:'+c.id,'یادآوری چک '+CHK_TY[c.type],c.party,c.amt,c.due)});
S.debts.forEach(d=>{if(d.due&&d.amt>d.paid)add('debt:'+d.id,d.kind=='cred'?'سررسید طلب':'سررسید بدهی',d.p,d.amt-d.paid,d.due)});return o}
const remN=()=>typeof S!='undefined'&&S?agenda().filter(a=>a.due<=tmr()).length:0;
function idbKv(k,v){return new Promise(res=>{try{const t=idb.transaction('kv',v===undefined?'readonly':'readwrite'),s=t.objectStore('kv'),r=v===undefined?s.get(k):s.put(v,k);t.oncomplete=()=>res(r.result);t.onerror=()=>res()}catch(e){res()}})}
const syncAgenda=()=>idbKv('agenda',agenda());
async function checkRem(){await syncAgenda();if(!('Notification' in window)||Notification.permission!='granted')return;const done=(await idbKv('notified'))||{},T=[todayISO(),tmr()];let ch=0;
for(const a of agenda()){const key=a.k+'@'+a.due;if(!T.includes(a.due)||done[key])continue;try{const r=await navigator.serviceWorker?.ready;if(r)await r.showNotification(a.t,{body:a.b,tag:a.k,icon:'icons/icon-192.png',dir:'rtl',lang:'fa'});else new Notification(a.t,{body:a.b,dir:'rtl'});done[key]=Date.now();ch=1}catch(e){}}
if(ch){for(const k in done)if(Date.now()-done[k]>7776e6)delete done[k];await idbKv('notified',done)}}
async function remEnable(){if(!('Notification' in window))return toast('این مرورگر از اعلان پشتیبانی نمی‌کند',1);const p=await Notification.requestPermission();if(p!='granted'){render();return toast('اجازهٔ اعلان داده نشد',1)}try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.register('due-check',{minInterval:12*36e5})}catch(e){}await checkRem();toast('اعلان‌ها فعال شد ✓');render()}
function remCard(){const sup='Notification' in window,p=sup?Notification.permission:'x',ios=/iphone|ipad|ipod/i.test(navigator.userAgent),st=p=='granted'?'فعال':p=='denied'?'مسدود (از تنظیمات مرورگر باز کنید)':p=='default'?'فعال نشده':'پشتیبانی نمی‌شود';
return`<div class="c"><h3>یادآوری سررسیدها</h3><p class="mu" style="margin-bottom:6px">وضعیت اعلان: <b>${st}</b></p><p class="mu" style="font-size:12.5px">بدون سرور، اعلان فقط هنگام باز بودن برنامه نمایش داده می‌شود؛ در بعضی نسخه‌های کروم اندروید (پس از نصب برنامه) ممکن است مرورگر هر چند ساعت آن را در پس‌زمینه هم بیدار کند، ولی زمان دقیق تضمین‌شده نیست. ${ios?'در آیفون اعلان پس‌زمینه بدون سرور قابل‌اتکا نیست. ':''}به همین دلیل سررسیدهای امروز، فردا و معوق همیشه بالای «داشبورد» هم نمایش داده می‌شوند.</p>${p=='default'?'<button class="b" style="width:100%" onclick="remEnable()">فعال‌سازی اعلان‌ها</button>':''}</div>`}
function remBanner(){const td=todayISO(),L=agenda().filter(a=>a.due<=tmr()).sort((a,b)=>a.due<b.due?-1:1);if(!L.length)return'';return`<div class="c" style="margin-bottom:10px"><h3>سررسیدهای نزدیک</h3>${L.slice(0,6).map(a=>`<div class="it"><div style="flex:1;min-width:0"><b>${esc(a.n)}</b><div class="mu">${a.t.replace('یادآوری ','')} · ${jfa(a.due)}</div></div><div style="text-align:left"><b>${money(a.a)}</b><br>${dueTag(a.due)||'<span class="bdg w">فردا</span>'}</div></div>`).join('')}${L.length>6?`<p class="mu" style="margin:8px 0 0">و ${fa(L.length-6)} مورد دیگر…</p>`:''}</div>`}
